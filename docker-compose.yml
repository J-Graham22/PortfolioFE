services:
  site:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # The back end (NewPortfolioWebsiteBE). From inside a container, use an
      # address the container can reach, not localhost, e.g.
      # http://host.docker.internal:8080 or the back end's service name.
      API_URL: ${API_URL:-http://host.docker.internal:8080}
      # Set this to your public URL, e.g. https://example.com
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
