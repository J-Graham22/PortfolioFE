services:
  site:
    build: .
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      # Override the dev paths from .env with the persistent volume.
      DATABASE_URL: /data/site.db
      UPLOAD_DIR: /data/uploads
      # Set this to your public URL, e.g. https://example.com
      ORIGIN: ${ORIGIN:-http://localhost:3000}
    volumes:
      - site-data:/data

volumes:
  site-data:
